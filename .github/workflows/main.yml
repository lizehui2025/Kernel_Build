name: 加速版构建 6.6.89 欧加真OKI内核 (测试)

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118'
  KERNEL_NAME: 'android15-8-g93e223c276e7-abogki500782043-4k'

on:
  workflow_dispatch:
    inputs:
      DEVICES_NAME:
        description: "请选择要编译的机型："
        required: true
        type: choice
        options:
          - 'oneplus_13'
          - 'oneplus_ace5_pro'
          - 'oneplus_ace_6'
          - 'oneplus_13t'
          - 'oneplus_pad_2_pro'
          - 'oneplus_ace5_ultra'
          - 'realme_GT7'
          - 'realme_GT7pro'
          - 'realme_GT7pro_Speed'
          - 'realme_GT8'
        default: 'oneplus_13'

      keep_original_settings:
        description: "保持原内核名称及构建时间(不懂请保持默认)"
        required: false
        default: true
        type: boolean

      custom_kernel_suffix:
        description: " 自定义内核名称- 仅在取消勾选'保持原设置'时有效(不懂请保持默认)"
        required: false
        default: ''

      custom_kernel_time:
        description: " 自定义构建时间- 仅在取消勾选'保持原设置'时有效(不懂请保持默认)"
        required: false
        default: ''
          
      clang_version:
        description: '选择编译内核的Clang工具链'
        required: true
        type: choice
        default: 'zycromerz'
        options:
          - 'zycromerz'
          - 'clang19'
          - 'clang18'

      lto_type:
        description: 'LTO 优化等级 (none = 快, thin = 默认, full = 慢)'
        required: true
        type: choice
        default: 'thin'
        options:
          - 'none'
          - 'thin'
          - 'full'

      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true

      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(ZRAM优化)'
        required: true
        type: boolean
        default: 'false'
        
      zram_writeback:
        description: '开启 ZRAM Writeback (更好的内存管理)'
        required: true
        type: boolean
        default: 'false'
        
      schedutil_opt:
        description: '开启 SchedUtil 优化 (提升 CPU 调度器响应)'
        required: true
        type: boolean
        default: 'false'
        
      cpu_opt:
        description: 'CPU 优化 (针对 SM8750 Oryon 核心调优)'
        required: true
        type: boolean
        default: 'true'

      bbr_enable:
        description: "是否启用bbr/brutal算法(false关闭,true加入算法,default启用并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'

      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'

      rekernel_enable:
        description: '是否启用Re-Kernel支持(提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
        
      baseband_guard:
        description: '是否开启内核级基带保护(防格机)'
        required: true
        type: boolean
        default: 'true'

      better_net:
        description: '开启网络功能拓展配置(为ipset/iptables提供支持)'
        required: true
        type: boolean
        default: 'true'
        
      lrng_enable:
        description: '开启 LRNG v60 (提供更好的加密/游戏随机数熵)'
        required: true
        type: boolean
        default: 'false'

      autofdo_enable:
        description: '是否启用 AutoFDO (使用 Google 官方预编译 .afdo 文件优化)'
        required: true
        type: boolean
        default: true

      autofdo_noinline_fix:
        description: 'AutoFDO 的 noinline 化妆补丁 (只为 kallsyms 一致, 零性能价值; 卡开机二分时关掉它)'
        required: true
        type: boolean
        default: true

      polly_enable:
        description: '是否启用 Polly 自动并行化 (与内存优化补丁存在冲突风险, 建议二选一)'
        required: true
        type: boolean
        default: false

      mem_opt_patches:
        description: '是否应用 WildKernels 内存/调度优化补丁 (建议与 Polly 互斥)'
        required: true
        type: boolean
        default: true

      bore_enable:
        description: 'Enable BORE Scheduler (Burst-Oriented Response Enhancer, off by default)'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVICES_NAME:           ${{ github.event.inputs.DEVICES_NAME }}
      KEEP_ORIGINAL_SETTINGS: ${{ github.event.inputs.keep_original_settings }}
      CUSTOM_KERNEL_SUFFIX:   ${{ github.event.inputs.custom_kernel_suffix }}
      CUSTOM_KERNEL_TIME:     ${{ github.event.inputs.custom_kernel_time }}
    steps:
      - name: 配置 Swap 空间 (防止编译内存溢出)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: ⚙️ Set REPO_MANIFEST (设置对应机型配置文件)
        run: |
          case "${{ env.DEVICES_NAME }}" in
            oneplus_ace5_pro)
              echo "REPO_MANIFEST=sm8750_b_16.0.0_oneplus_ace5_pro" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_ace5_pro_b" >> $GITHUB_ENV
              ;;
            oneplus_13)
              echo "REPO_MANIFEST=sm8750_b_16.0.0_oneplus_13" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_13_b" >> $GITHUB_ENV
              ;;
            oneplus_ace_6)
              echo "REPO_MANIFEST=sm8750_b_16.0.0_ace_6" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_ace_6" >> $GITHUB_ENV
              ;;
            oneplus_13t)
              echo "REPO_MANIFEST=sm8750_b_16.0.0_oneplus_13t" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_13t_b" >> $GITHUB_ENV
              ;;
            oneplus_pad_2_pro)
              echo "REPO_MANIFEST=sm8750_b_16.0.0_pad_2_pro" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_pad_2_pro_b" >> $GITHUB_ENV
              ;;
            oneplus_ace5_ultra)
              echo "REPO_MANIFEST=mt6991_b_16.0.0_oneplus_ace5_ultra" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_ace5_ultra_b" >> $GITHUB_ENV
              ;;
            realme_GT7)
              echo "REPO_MANIFEST=mt6991_b_16.0.0_oneplus_ace5_ultra" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_ace5_ultra_b" >> $GITHUB_ENV
              ;;
            realme_GT7pro)
              echo "IMAGENAME=Image_Rm_GT_7_Pro" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_ace_6" >> $GITHUB_ENV
              ;;
            realme_GT7pro_Speed)
              echo "IMAGENAME=Image_Rm_GT_7_Pro_Speed" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_ace_6" >> $GITHUB_ENV
              ;;
            realme_GT8)
              echo "IMAGENAME=Image_Rm_GT_8" >> $GITHUB_ENV
              echo "SCHED_FILE=oneplus_ace_6" >> $GITHUB_ENV
          esac
          if [ -z "${{ github.event.inputs.custom_kernel_suffix }}" ]; then
            case "${{ env.DEVICES_NAME }}" in
             oneplus_pad_2_pro)
                DEFAULT_SUFFIX='-android15-8-g096cdb6ecefc-ab14358676-4k'
              ;;
            oneplus_ace5_ultra)
                DEFAULT_SUFFIX='-android15-8-ge6068c2aa11d-abogki454747580-4k'
              ;;
            oneplus_13 | oneplus_13t | oneplus_ace5_pro | oneplus_ace_6 | realme_GT7 | realme_GT7pro_Speed | realme_GT8)
                DEFAULT_SUFFIX='-android15-8-g93e223c276e7-abogki500782043-4k'
              ;;
            realme_GT7pro)
                DEFAULT_SUFFIX='-android15-8-gf4dc45704e54-abogki446052083-4k'
              ;;
          esac
            echo "DEFAULT_SUFFIX=$DEFAULT_SUFFIX" >> $GITHUB_ENV
            echo "使用原官核名称：$DEFAULT_SUFFIX"
          else
              # 验证用户输入是否以 - 开头
              if [[ "${{ github.event.inputs.custom_kernel_suffix }}" != -* ]]; then
                echo "::warning::自定义内核名称请以 - 开头"
                echo "示例：-android15-8-g096cdb6ecefc-ab14358676-4k"
              fi
            echo "使用自定义名称: ${{ github.event.inputs.custom_kernel_suffix }}"
            echo "DEFAULT_SUFFIX=${{ github.event.inputs.custom_kernel_suffix }}" >> $GITHUB_ENV
          fi
          if [ -z "${{ github.event.inputs.custom_kernel_time }}" ]; then
            case "${{ env.DEVICES_NAME }}" in
              oneplus_pad_2_pro)
                  KERNEL_TIME='Tue Oct 28 09:04:21 UTC 2025'
                ;;
              oneplus_ace5_ultra)
                  KERNEL_TIME='Tue Jul 1 19:48:18 UTC 2025'
                ;;
              oneplus_13 | oneplus_13t | oneplus_ace5_pro | oneplus_ace_6 | realme_GT7 | realme_GT7pro_Speed | realme_GT8)
                  KERNEL_TIME='Wed Apr 8 15:08:30 UTC 2026'
                ;;
              realme_GT7pro)
                  KERNEL_TIME='Fri Sep 19 06:13:40 UTC 2025'
                ;;
            esac
            echo "KERNEL_TIME=$KERNEL_TIME" >> $GITHUB_ENV
            echo "使用官核时间：$KERNEL_TIME"
          else
            echo "使用自定义构建时间: ${{ github.event.inputs.custom_kernel_time }}"
            echo "KERNEL_TIME=${{ github.event.inputs.custom_kernel_time }}" >> $GITHUB_ENV
          fi


      - name: 缓存工具链 (按 clang_version 分键)
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            kernel_workspace/zyc-clang
            kernel_workspace/clang19
            kernel_workspace/clang18
            kernel_workspace/build-tools
            kernel_workspace/rust
          key: tc-${{ github.event.inputs.clang_version }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tc-${{ github.event.inputs.clang_version }}-${{ runner.os }}-

      - name: 配置并恢复 CCache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_KEY=ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"

      - name: 恢复 CCache 缓存
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-

      - name: 安装环境依赖 + 初始化源码及工具链
        run: |
          set -uo pipefail
          WORKDIR="$GITHUB_WORKSPACE"
          CLANG_VARIANT="${{ github.event.inputs.clang_version }}"
          cd "$WORKDIR"

          sudo apt-mark hold firefox >/dev/null 2>&1 || true
          sudo apt-mark hold libc-bin >/dev/null 2>&1 || true
          sudo apt purge -y man-db >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/man-db/auto-update

          sudo apt-get update -qq
          # pahole 参与 CONFIG_DEBUG_INFO_BTF 生成。版本不固定时, 新版 pahole 发射的
          # BTF 可能被 6.6 的 verifier 拒绝 -> 编译通过但 /sys/kernel/btf/vmlinux
          # 缺失 -> Android init 起不来。这里显式锁定, 把风险挡在构建期。
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev ccache aria2 dos2unix cmake

          echo "准备源码目录..."
          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          # ── 并行拉取。所有后台任务显式收集 PID 并逐个 wait:
          #    bash 的 `wait` 不带参数恒返回 0, 会把下载失败静默吞掉。
          pids=()

          (
            aria2c -s16 -x16 -k1M \
              https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118.zip \
              -o common.zip &&
            unzip -q common.zip &&
            mv "android_kernel_common_oneplus_sm8750-oneplus-sm8750_b_16.0.0_oneplus_13_6.6.118" common &&
            rm -f common.zip
          ) & pids+=($!)

          (
            case "$CLANG_VARIANT" in
              zycromerz)
                # ZyCromerZ Clang 19.0.0git-20240723 — LLVM 19 main 分支快照 (2024-07-23)。
                # oryon-1 于 2024-06-06 合入 (PR #91022), 该快照晚于合入点, 故 -mcpu=oryon-1 可用。
                echo "[toolchain] ZyCromerZ Clang 19.0.0git-20240723 (tar.gz)"
                mkdir -p zyc-clang
                aria2c -x16 -s16 -k1M -j16 --retry-wait=5 --max-tries=10 \
                  -d /tmp -o zyc-clang.tar.gz \
                  "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz" &&
                tar -C zyc-clang -zxf /tmp/zyc-clang.tar.gz &&
                rm -f /tmp/zyc-clang.tar.gz
                ;;
              clang19)
                echo "[toolchain] Google LLVM-Clang19 r536225"
                mkdir -p clang19
                aria2c -s16 -x16 -k1M \
                  https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip \
                  -o clang19.zip &&
                unzip -q clang19.zip -d clang19 && rm -f clang19.zip
                ;;
              clang18)
                echo "[toolchain] Google LLVM-Clang18 r510928"
                mkdir -p clang18
                aria2c -s16 -x16 -k1M \
                  https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip \
                  -o clang18.zip &&
                unzip -q clang18.zip -d clang18 && rm -f clang18.zip
                ;;
            esac
          ) & pids+=($!)

          (
            # ZyCromerZ 搭配 CodeLinaro 官方 build-tools (高通 GKI 标准件),
            # bin 路径为 linux-x86/bin; Google zip 版则是 bin/。此处按变体分派。
            if [[ "$CLANG_VARIANT" == "zycromerz" ]]; then
              echo "[build-tools] CodeLinaro ks-kernel.lnx.4.0.r1-rel"
              git clone --depth=1 -b ks-kernel.lnx.4.0.r1-rel \
                https://git.codelinaro.org/clo/la/kernel/prebuilts/build-tools.git build-tools
            else
              case "$CLANG_VARIANT" in
                clang19) TAG="LLVM-Clang19-r536225" ;;
                clang18) TAG="LLVM-Clang18-r510928" ;;
              esac
              echo "[build-tools] Google $TAG"
              aria2c -s16 -x16 -k1M \
                "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/$TAG/build-tools.zip" \
                -o build-tools.zip &&
              unzip -q build-tools.zip && rm -f build-tools.zip
            fi
          ) & pids+=($!)

          if [[ "$CLANG_VARIANT" == "clang19" ]]; then
            (
              echo "[rust] Rust 1.82.0"
              mkdir -p rust
              aria2c -s16 -x16 -k1M \
                https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip \
                -o rust.zip &&
              unzip -q rust.zip -d rust && rm -f rust.zip
            ) & pids+=($!)
          fi

          failed=0
          for p in "${pids[@]}"; do
            wait "$p" || { echo "::error::并行下载任务失败 (pid=$p)"; failed=1; }
          done
          [[ $failed -eq 0 ]] || { echo "::error::源码或工具链下载不完整, 中止"; exit 1; }

          # ── 定位工具链 bin: 之后所有步骤只读 CLANG_BIN / BUILD_TOOLS_BIN,
          #    不再各自重复一遍版本判断 (原先 install 与 build 两处各有一份 if/elif)。
          find_clang_bin() {
            local d
            d="$(find "$1" \( -type f -o -type l \) -name clang \
                 -path '*/bin/clang' -printf '%h\n' 2>/dev/null | head -1)"
            [[ -n "$d" ]] || d="$(find "$1" \( -type f -o -type l \) -name clang \
                 -printf '%h\n' 2>/dev/null | head -1)"
            echo "$d"
          }

          case "$CLANG_VARIANT" in
            zycromerz) CLANG_ROOT="$WORKDIR/kernel_workspace/zyc-clang" ;;
            clang19)   CLANG_ROOT="$WORKDIR/kernel_workspace/clang19" ;;
            clang18)   CLANG_ROOT="$WORKDIR/kernel_workspace/clang18" ;;
          esac

          CLANG_BIN="$(find_clang_bin "$CLANG_ROOT")"
          if [[ -z "$CLANG_BIN" || ! -x "$CLANG_BIN/clang" ]]; then
            echo "::error::未能在 $CLANG_ROOT 定位可用的 clang"
            find "$CLANG_ROOT" -maxdepth 3 -name 'clang*' 2>/dev/null | head -20
            exit 1
          fi

          if [[ -d "$WORKDIR/kernel_workspace/build-tools/linux-x86/bin" ]]; then
            BUILD_TOOLS_BIN="$WORKDIR/kernel_workspace/build-tools/linux-x86/bin"
          elif [[ -d "$WORKDIR/kernel_workspace/build-tools/bin" ]]; then
            BUILD_TOOLS_BIN="$WORKDIR/kernel_workspace/build-tools/bin"
          else
            BUILD_TOOLS_BIN=""
            echo "::warning::未找到 build-tools 目录, 仅依赖工具链自带 bin"
          fi

          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "BUILD_TOOLS_BIN=$BUILD_TOOLS_BIN" >> $GITHUB_ENV

          echo "───────── 工具链自检 ─────────"
          echo "变体       : $CLANG_VARIANT"
          echo "Clang      : $("$CLANG_BIN/clang" --version | head -1)"
          echo "ld.lld     : $("$CLANG_BIN/ld.lld" --version 2>/dev/null | head -1 || echo 缺失)"
          echo "build-tools: ${BUILD_TOOLS_BIN:-<无>}"
          [[ -x "$WORKDIR/kernel_workspace/rust/bin/rustc" ]] && \
            echo "rustc      : $("$WORKDIR/kernel_workspace/rust/bin/rustc" --version)"
          echo "pahole     : $(pahole --version 2>/dev/null | head -1 || echo 未安装)"
          echo "──────────────────────────────"

          echo "去除 ABI 保护及 dirty 后缀..."
          rm -f common/android/abi_gki_protected_exports_*
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 提取并配置 Oplus 官方 AutoFDO Profile
        if: inputs.autofdo_enable
        run: |
          echo "正在配置 AutoFDO Profile..."
          cd kernel_workspace
          
          # 定义 Oplus 源码自带的 AFDO 路径
          OPLUS_AFDO_PATH="common/android/gki/aarch64/afdo/kernel.afdo"
          
          if [ -f "$OPLUS_AFDO_PATH" ]; then
            echo "成功检测到 Oplus 源码自带的 kernel.afdo，完美匹配当前内核，直接提取使用！"
            cp "$OPLUS_AFDO_PATH" kernel_aarch64.afdo
          else
            echo "警告：未在源码目录 ($OPLUS_AFDO_PATH) 找到配置文件。"
            echo "尝试从 AOSP 官方仓库拉取作为备选..."
            
            AOSP_BRANCH="${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
            AFDO_URL="https://android.googlesource.com/kernel/common/+/refs/heads/$AOSP_BRANCH/android/gki/aarch64/afdo/kernel.afdo?format=TEXT"
            
            HTTP_CODE=$(curl -s -w "%{http_code}" -o kernel_afdo_base64.txt "$AFDO_URL")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "成功从 AOSP 拉取 $AOSP_BRANCH 分支配置！"
              base64 -d kernel_afdo_base64.txt > kernel_aarch64.afdo
            else
              echo "回退拉取 AOSP mainline 基线配置..."
              FALLBACK_URL="https://android.googlesource.com/kernel/common/+/refs/heads/android-mainline/android/gki/aarch64/afdo/kernel.afdo?format=TEXT"
              FALLBACK_CODE=$(curl -s -w "%{http_code}" -o kernel_afdo_base64_fallback.txt "$FALLBACK_URL")
              if [ "$FALLBACK_CODE" -eq 200 ]; then
                  base64 -d kernel_afdo_base64_fallback.txt > kernel_aarch64.afdo
              else
                  echo "::error::备选 AOSP Profile 也拉取失败！"
                  exit 1
              fi
            fi
            rm -f kernel_afdo_base64*.txt
          fi
          
          if [ -s kernel_aarch64.afdo ]; then
            echo "AutoFDO 配置文件就绪，准备注入编译器！文件信息："
            ls -lh kernel_aarch64.afdo
          else
            echo "::error::AutoFDO 配置文件提取或下载失败，文件为空！"
            exit 1
          fi

      - name: 🔧 Setup Patches | 配置补丁
        run: |
          cd kernel_workspace

          echo "⬇️ 克隆所需补丁..."

          git clone https://github.com/mrcxlinux/kernel_patches.git
          git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git wildkernels_patches &
          wait

          echo "📝 复制补丁文件..."

          cd ./common

          if [[ "${{ github.event.inputs.polly_enable }}" == "true" ]]; then
            cp ../kernel_patches/common/EnablePOLLY.patch ./
            echo "📦 启用 POLLY 支持..."
            git apply -p1 < EnablePOLLY.patch || true
          else
            echo "⏭️  已跳过 POLLY 补丁"
          fi

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          git clone --depth=1 https://github.com/cctv18/oppo_oplus_realme_sm8750.git
          cp ./oppo_oplus_realme_sm8750/zram_patch/001-lz4.patch ./common/
          cp ./oppo_oplus_realme_sm8750/zram_patch/lz4armv8.S ./common/lib
          cp ./oppo_oplus_realme_sm8750/zram_patch/002-zstd.patch ./common/
          cd ./common
          git apply -p1 < 001-lz4.patch || true
          patch -p1 < 002-zstd.patch || true

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace
          if [ ! -d "SukiSU_patch" ]; then
            git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
          fi
          cd common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true
      
          
      - name: 添加其他配置项
        run: |
          cd kernel_workspace
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig

          if [[ "${{ github.event.inputs.polly_enable }}" == "true" ]]; then
            echo "CONFIG_LLVM_POLLY=y" >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "# CONFIG_LLVM_POLLY is not set (由 polly_enable=false 关闭)" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ github.event.inputs.autofdo_enable }}" == "true" ]]; then
            echo "CONFIG_AUTOFDO_CLANG=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          # Polly 会重新并行化/向量化循环, 可能覆盖 mem_opt_patches 里手工调优过的
          # 循环结构(mem_opt_prefetch / optimise_memcmp / int_sqrt 等)。
          if [[ "${{ github.event.inputs.polly_enable }}" == "true" && "${{ github.event.inputs.mem_opt_patches }}" == "true" ]]; then
            echo "::warning::polly_enable 与 mem_opt_patches 同时开启。"
            echo "::warning::两者都做循环级变换, 建议二选一后用 llvm-objdump -d 对比 Image 指令数再定夺。"
          fi
          # 注: -mcpu=oryon-1 的可用性不在此处判断, 由"准备 CPU 优化"步骤实测探测
          # (Google r536225/r510928 不认 oryon-1, 只有 ZyCromerZ 认, 看版本号不准)。
            
      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          cd kernel_workspace
          echo "CONFIG_BPF_STREAM_PARSER=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_WIREGUARD=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd common
          wget https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/other_patch/config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        if: inputs.bbr_enable != 'false'
        run: |
          echo "正在添加BBR等拥塞控制算法..."
          cd kernel_workspace
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
            echo "正在将BBR设为默认拥塞控制算法..."
            # 1. 显式禁用原有的默认 CUBIC 算法
            sed -i 's/CONFIG_DEFAULT_CUBIC=y/# CONFIG_DEFAULT_CUBIC is not set/g' ./common/arch/arm64/configs/gki_defconfig
            # 2. 开启 DEFAULT_BBR 选项
            echo "CONFIG_DEFAULT_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_FQ=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo 'CONFIG_DEFAULT_NET_SCH="fq"' >> ./common/arch/arm64/configs/gki_defconfig
            # 3. 写入带有双引号的字符串（注意外面用单引号，里面用双引号）
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "正在将CUBIC设为默认拥塞控制算法..."
            echo "CONFIG_DEFAULT_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo 'CONFIG_DEFAULT_TCP_CONG="cubic"' >> ./common/arch/arm64/configs/gki_defconfig
          fi

      - name: 启用ADIOS IO调度器
        if: inputs.adios_enable
        run: |
          echo "正在启用ADIOS IO调度器(降低I/O延迟)…"
          cd kernel_workspace
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          echo "正在启用Re-Kernel支持(提升冻结后台能力)…"
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用内核级基带保护
        if: inputs.baseband_guard
        run: |
          echo "正在启用内核级基带保护支持…"
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 配置 LTO
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.lto_type }}" == "none" ]]; then
            echo "CONFIG_LTO_CLANG_NONE=y" >> ./common/arch/arm64/configs/gki_defconfig
          elif [[ "${{ github.event.inputs.lto_type }}" == "full" ]]; then
            echo "CONFIG_LTO_CLANG_FULL=y" >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "CONFIG_LTO_CLANG_THIN=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

      - name: Apply BORE Scheduler
        if: inputs.bore_enable
        working-directory: kernel_workspace/common
        run: |
          set +e
          BORE_URL="https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/patches/bore.patch"
          wget -q --tries=3 --timeout=15 -O /tmp/bore.patch "$BORE_URL"
          wget_rc=$?
          set -e

          if [[ $wget_rc -ne 0 || ! -s /tmp/bore.patch ]]; then
            echo "⚠️  Failed to fetch bore.patch from primary URL ($BORE_URL)."
            echo "    Trying firelzhd/bore-sched-ext upstream (linux-6.6.y-bore)..."
            UP_URL="https://github.com/firelzhd/bore-sched-ext/raw/linux-6.6.y-bore/bore.patch"
            wget -q --tries=3 --timeout=15 -O /tmp/bore.patch "$UP_URL" || true
            if [[ ! -s /tmp/bore.patch ]]; then
              echo "::error::Cannot fetch bore.patch from any source. Aborting step."
              exit 1
            fi
          fi

          # 6.6.118 的 OnePlus sm8750 树已回归上游 EEVDF 默认值
          # (0.70 msec / 700000ULL),与 bore.patch 原始 context 一致。
          # 注:6.6.89 树曾自定义成 0.75 msec / 750000ULL,但 6.6.118 不再如此。
          # 故无需 sed 适配,直接原样应用即可。

          # 前次失败可能残留 .rej/.orig,清掉避免污染
          find . \( -name '*.rej' -o -name '*.orig' \) -delete 2>/dev/null || true

          # 先不写 defconfig:patch 成功并通过真实校验后再写,
          # 否则在 patch 失败时 CONFIG_SCHED_BORE=y 会被 olddefconfig 静默丢弃,
          # 造成"用户以为启用但实际没有"的假冒状态。
          if patch -p1 --forward -F 3 < /tmp/bore.patch; then
            # 真实落地校验(类似 SUSFS 的 SUS_MAP guard):
            # bore.patch 在 fair.c Hunk #2 注入了 nsecs_per_tick / update_sysctl,
            # 如果 Hunk #2 没应用上,这两个符号就不存在,直接 exit 1。
            if grep -q 'nsecs_per_tick' kernel/sched/fair.c \
               && grep -q 'update_sysctl' kernel/sched/fair.c; then
              echo "CONFIG_SCHED_BORE=y" >> arch/arm64/configs/gki_defconfig
              echo "✅ BORE scheduler applied & symbols verified (nsecs_per_tick/update_sysctl found)"
            else
              echo "::error::BORE patch reported success but fair.c key symbols missing"
              echo "--- fair.c context around sysctl_sched_base_slice ---"
              grep -n -A5 -B5 'sysctl_sched_base_slice' kernel/sched/fair.c | head -40
              exit 1
            fi
          else
            echo "::error::BORE patch failed to apply. Dumping rejects:"
            find . -name '*.rej' -exec sh -c \
              'echo "==== {} ===="; cat "{}"' \;
            exit 1
          fi

      - name: Apply Memory & Scheduler Optimization Patches
        if: inputs.mem_opt_patches
        working-directory: kernel_workspace/common
        run: |
          echo "Applying WildKernels optimization patches..."
          PATCHES_DIR="../wildkernels_patches/common"
          ok=0; skip=0; missing=0

          apply_patch() {
            local patch="$1"
            if [ -f "$PATCHES_DIR/$patch" ]; then
              if patch -p1 --forward < "$PATCHES_DIR/$patch"; then
                echo "✅ $patch"; ok=$((ok+1))
              else
                echo "⚠️ $patch (skipped/conflict)"; skip=$((skip+1))
              fi
            else
              echo "⚠️ $patch not found, skipping"; missing=$((missing+1))
            fi
          }

          apply_patch "optimized_mem_operations.patch"
          apply_patch "file_struct_8bytes_align.patch"
          apply_patch "reduce_cache_pressure.patch"
          apply_patch "mem_opt_prefetch.patch"
          apply_patch "optimise_memcmp.patch"
          apply_patch "minimise_wakeup_time.patch"
          apply_patch "int_sqrt.patch"
          apply_patch "force_tcp_nodelay.patch"
          apply_patch "reduce_gc_thread_sleep_time.patch"
          apply_patch "add_timeout_wakelocks_globally.patch"
          apply_patch "f2fs_reduce_congestion.patch"
          apply_patch "reduce_freeze_timeout.patch"
          apply_patch "clear_page_16bytes_align.patch"
          apply_patch "add_limitation_scaling_min_freq.patch"
          apply_patch "re_write_limitation_scaling_min_freq.patch"
          apply_patch "adjust_cpu_scan_order.patch"
          apply_patch "avoid_extra_s2idle_wake_attempts.patch"
          apply_patch "disable_cache_hot_buddy.patch"
          apply_patch "f2fs_enlarge_min_fsync_blocks.patch"
          apply_patch "increase_ext4_default_commit_age.patch"
          apply_patch "increase_sk_mem_packets.patch"
          apply_patch "reduce_pci_pme_wakeups.patch"
          apply_patch "silence_irq_cpu_logspam.patch"
          apply_patch "silence_system_logspam.patch"
          apply_patch "use_unlikely_wrap_cpufreq.patch"

          echo "✅ Optimization patches: applied=$ok skipped=$skip missing=$missing"
          if [ "$skip" -gt 0 ] || [ "$missing" -gt 0 ]; then
            echo "::warning::部分优化补丁未生效, 收益会低于预期。请检查上游补丁是否已合入 6.6.118。"
          fi

      - name: Apply BBRv3
        if: inputs.bbr_enable != 'false'
        working-directory: kernel_workspace/common
        run: |
          echo "::group::Apply BBRv3 patches"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_BBR3=y"     >> arch/arm64/configs/gki_defconfig
          BBRV3_PATCH="../wildkernels_patches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          if [ -f "$BBRV3_PATCH" ]; then
            patch -p1 -F 3 < "$BBRV3_PATCH"
            echo "✅ BBRv3 patch applied"
          else
            echo "::warning::BBRv3 patch not found at $BBRV3_PATCH — skipping"
          fi
          echo "::endgroup::"


      - name: Enable Wakelock Blocker
        working-directory: kernel_workspace/common
        run: |
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_PM_WAKELOCKS=y
          CONFIG_PM_WAKELOCKS_GC=y
          CONFIG_PM_WAKELOCKS_LIMIT=100
          EOF
          WAKELOCK_C="kernel/power/wakelock.c"
          if [ -f "$WAKELOCK_C" ]; then
            cat >> "$WAKELOCK_C" << 'WLEOF'
          /* palaziks: wakelock blocker list */
          static const char * const blocked_wakelocks[] = {
              "WLAN_pm_wlock",
              "IPA_WS",
              "qcom_rx_wakelock",
              "event0",
          };
          WLEOF
          fi

      - name: Enable WireGuard
        working-directory: kernel_workspace
        run: |
          echo "CONFIG_WIREGUARD=y" >> common/arch/arm64/configs/gki_defconfig

      - name: 配置 ZRAM Writeback
        if: inputs.zram_writeback
        working-directory: kernel_workspace
        run: |
          echo "Enabling ZRAM Writeback support..."
          echo "CONFIG_ZRAM_WRITEBACK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_ZRAM_MEMORY_TRACKING=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_ZRAM_MULTI_COMP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_ZRAM_DEF_COMP="lz4"' >> ./common/arch/arm64/configs/gki_defconfig

      - name: 配置 SchedUtil 优化
        if: inputs.schedutil_opt
        working-directory: kernel_workspace
        run: |
          echo "Applying SchedUtil optimizations..."
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> ./common/arch/arm64/configs/gki_defconfig
           

      - name: 准备 CPU 优化 (Oryon SM8750)
        if: inputs.cpu_opt
        run: |
          set -euo pipefail
          echo "Setting up CPU tuning..."
          cd kernel_workspace
          DEFCONFIG=./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_ARM64_ERRATUM_2658417=y" >> "$DEFCONFIG"
          echo "CONFIG_ARCH_QCOM=y" >> "$DEFCONFIG"
          echo "CONFIG_HZ_300=y" >> "$DEFCONFIG"
          echo "CONFIG_PREEMPT=y" >> "$DEFCONFIG"
          echo "CONFIG_NO_HZ_IDLE=y" >> "$DEFCONFIG"
          echo "CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y" >> "$DEFCONFIG"
          # defconfig 里写 `CONFIG_X=n` 不会关掉选项(olddefconfig 仍会取 Kconfig 默认值 y),
          # 必须写成注释形式。要关闭就删掉已存在的行再追加 not-set。
          sed -i '/^CONFIG_RCU_LAZY_DEFAULT_OFF=/d; /^# CONFIG_RCU_LAZY_DEFAULT_OFF is not set/d' "$DEFCONFIG"
          echo "# CONFIG_RCU_LAZY_DEFAULT_OFF is not set" >> "$DEFCONFIG"

          # 真正的 Oryon codegen 目标。此前该步骤只写 Kconfig, 没有任何 -mcpu,
          # 导致"CPU 优化"名不副实。
          # 是否加 -mcpu=oryon-1 不看版本号、直接问编译器:
          # Google 的 r536225/r510928 快照早于 oryon 合入点, 会报 unsupported argument,
          # 只有 ZyCromerZ 认。探不过就干净失败, 不拖到编译 scripts/mod/empty.o 才炸。
          # 注意 --target=aarch64 必不可少: 不带它时 -mcpu 作用于默认 target(x86),
          # 再新的 clang 也会误报不支持, 探测结果是错的。
          if echo 'int oryon_probe(void){return 0;}' | "${CLANG_BIN:?CLANG_BIN 未设置, 请检查工具链安装步骤}/clang" \
              --target=aarch64-linux-gnu -mcpu=oryon-1 -x c - -c -o /dev/null >/dev/null 2>&1; then
            echo "EXTRA_CFLAGS=-mcpu=oryon-1" >> $GITHUB_ENV
            echo "✅ EXTRA_CFLAGS=-mcpu=oryon-1 (当前工具链支持 oryon-1)"
          else
            echo "::error::当前工具链 ($CLANG_BIN) 不支持 -mcpu=oryon-1, 但 cpu_opt=true。"
            echo "::error::仅 ZyCromerZ 支持 oryon-1；请切换 clang_version=zycromerz，或关闭 cpu_opt。"
            exit 1
          fi

      - name: 启用 LRNG v60
        if: inputs.lrng_enable
        working-directory: kernel_workspace/common
        run: |
          echo "Enabling LRNG (Linux Random Number Generator) via v60 backports for v6.6..."
          
          # 1. 克隆源码到临时目录
          git clone --depth=1 https://github.com/smuellerDD/lrng.git /tmp/lrng_src
          
          echo "Applying LRNG v60 kernel patches for Linux 6.6..."

          # 第 1 步：应用所有 6 位数字的前置环境补丁
          for patch_file in $(ls /tmp/lrng_src/backports/v60-6.6.119/*-0000*.patch | sort); do
            echo "Step 1 - Applying: $(basename "$patch_file")"
            patch -p1 -F 3 --no-backup-if-mismatch < "$patch_file" || true
          done

          # 第 2 步：应用 v60 针对 Linux 6.18 的主体补丁
          for patch_file in $(ls /tmp/lrng_src/kernel_patches/v6.18/*.patch | sort); do
            echo "Step 2 - Applying: $(basename "$patch_file")"
            patch -p1 -F 3 --no-backup-if-mismatch < "$patch_file" || true
          done

          # 第 3 步：应用所有 2 位数字的适配兼容补丁
          for patch_file in $(ls /tmp/lrng_src/backports/v60-6.6.119/*-[0-9][0-9]-*.patch | sort); do
            echo "Step 3 - Applying: $(basename "$patch_file")"
            patch -p1 -F 3 --no-backup-if-mismatch < "$patch_file" || true
          done

          cd ..

          # 写入相关 GKI 配置
          echo "CONFIG_LRNG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRNG_SHA256=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRNG_COLLECTION_SIZE=1024" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRNG_HEALTH_TESTS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRNG_RCT_CUTOFF=31" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRNG_APT_CUTOFF=325" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRNG_IRQ=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRNG_CONTINUOUS_COMPRESSION_ENABLED=y" >> ./common/arch/arm64/configs/gki_defconfig




      - name: 🔧 Set Kernel name (设置内核名称)
        run: |
          cd kernel_workspace
          echo "内核后缀: $DEFAULT_SUFFIX"
          ESCAPED_SUFFIX=$(printf '%s\n' "$DEFAULT_SUFFIX" | sed 's:[\/&]:\\&:g')
          sudo sed -i "s/-4k/$ESCAPED_SUFFIX/g" ./common/arch/arm64/configs/gki_defconfig
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion


      - name: 🩺 绑定 QCOM ramoops (修复 pstore 无日志)
        working-directory: kernel_workspace/common
        run: |
          # 真机 DT 里只有 compatible="qcom,ramoops" 的节点 reserved-memory/ramoops-region
          # (console 256KB + pmsg 2MB)，上游驱动只认 "ramoops"，永远 bind 不上，
          # 故 /sys/fs/pstore 恒空、dmesg 无 ramoops 行。加一行匹配即可；
          # 缺失的 record-size/ftrace-size 按上游默认走 0(对应后端关闭)，console+pmsg 正常工作。
          # probe 失败也是 graceful(仅 pstore 继续为空)，无开不了机风险。
          cat > /tmp/ramoops-qcom-compatible.patch << 'PATCHEOF'
          --- a/fs/pstore/ram.c
          +++ b/fs/pstore/ram.c
          @@ -891,6 +891,7 @@

           static const struct of_device_id dt_match[] = {
           	{ .compatible = "ramoops" },
          +	{ .compatible = "qcom,ramoops" },
           	{}
           };

          PATCHEOF
          if patch -p1 --forward < /tmp/ramoops-qcom-compatible.patch; then
            echo "✅ ramoops 已绑定 qcom,ramoops；刷机后检查 dmesg 应有 ramoops 行，/sys/fs/pstore 应非空"
          else
            echo "::warning::ramoops 补丁未应用(可能上游已修)，跳过"
          fi

      - name: 🎯 限定 AutoFDO 作用域 (只优化 profile 未漂移的代码)
        if: inputs.autofdo_enable
        working-directory: kernel_workspace/common
        run: |
          # 原理: 无 sym-list 的 sample profile 下，profile 里没有的函数本来就是中性的，
          # 真正危险的是“profile 里有、但源码被补丁改过”的函数(采样错位 → 内联/ICP 误判)。
          # ACK 的 scripts/Makefile.lib 原生支持按文件关闭:
          #   AUTOFDO_PROFILE_<base>.o := n   (写在该文件所在目录的 Makefile 末尾)
          # 本步骤从“实际应用过的 patch”里解析出被改动的 .c，逐个关闭。
          # 新增文件(--- /dev/null)没有 profile 数据，本来就中性，跳过以节省排除量。
          set -uo pipefail
          EXCLUDE_TMP=/tmp/afdo_excluded.txt
          : > "$EXCLUDE_TMP"

          collect_from_patches() {
            # 只收“修改”(新老两侧都非 /dev/null)的 .c 文件。
            # 新增文件没有 profile 数据、本来就是中性的，排除它只会污染清单；
            # 删除文件(/dev/null 在 +++ 侧)无需处理。
            awk '/^--- /{old=$2; sub(/^b\//,"",old); sub(/\t.*$/,"",old); next}
                 /^\+\+\+ /{new=$2; sub(/^b\//,"",new); sub(/\t.*$/,"",new);
                   if (old != "/dev/null" && new != "/dev/null" && new ~ /\.c$/) print new;
                   old=""; next}' "$@" 2>/dev/null | sort -u || true
          }

          PATCH_FILES="$(ls ./*.patch 2>/dev/null || true)"
          PATCH_FILES="$PATCH_FILES $(ls /tmp/*.patch 2>/dev/null || true)"
          PATCH_FILES="$PATCH_FILES $(ls ../wildkernels_patches/common/*.patch 2>/dev/null || true)"
          if [ -d /tmp/lrng_src ]; then
            PATCH_FILES="$PATCH_FILES $(find /tmp/lrng_src -name '*.patch' 2>/dev/null || true)"
          fi
          # shellcheck disable=SC2086
          if [ -n "$(echo $PATCH_FILES | tr -d '[:space:]')" ]; then
            collect_from_patches $PATCH_FILES >> "$EXCLUDE_TMP" || true
          else
            echo "未发现已应用的 patch 文件，跳过解析"
          fi

          # 非 patch 形式的代码改动(heredoc 追加)：wakelock 步骤是无条件追加的
          if grep -q 'palaziks: wakelock blocker list' kernel/power/wakelock.c 2>/dev/null; then
            echo "kernel/power/wakelock.c" >> "$EXCLUDE_TMP"
          fi

          # tree-commit 带入的改动(patch 文件解析覆盖不到)：Fengchi 重写了调度核心
          # (core.c 470行/fork.c 31行等)，以 hmbird 目录存在为准——有目录=改动在，
          # 无目录=文件也是原装的，跳过即对。drm/msm/sysrq/init_task 那几个 hunk
          # 经查全是注释/数据/冷路径(见提交说明)，不影响采样归因，不管。
          # (计数器在此初始化：后面的 while 循环共用它)
          APPLIED=0
          if [ -d kernel/sched/hmbird ]; then
            for rel in kernel/fork.c kernel/sched/build_policy.c kernel/sched/core.c kernel/sched/debug.c; do
              [ -f "$rel" ] || continue
              dir=$(dirname "$rel"); base=$(basename "$rel" .c)
              line="AUTOFDO_PROFILE_${base}.o := n"
              if ! grep -qF "$line" "$dir/Makefile"; then
                echo "# AFDO scope: $rel 被 Fengchi tree-commit 改写" >> "$dir/Makefile"
                echo "$line" >> "$dir/Makefile"
                APPLIED=$((APPLIED+1)); echo "$rel (tree-commit)" >> "$EXCLUDE_TMP"
              fi
            done
          else
            echo "无 hmbird 目录，跳过 tree-commit 手动排除表"
          fi
          sort -u "$EXCLUDE_TMP" -o "$EXCLUDE_TMP"

          TOTAL=$(wc -l < "$EXCLUDE_TMP")
          echo "待排除文件数: $TOTAL"
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            [ -f "$rel" ] || { echo "  ⏭️ $rel 不在树中，跳过"; continue; }
            dir=$(dirname "$rel"); base=$(basename "$rel" .c)
            mk="$dir/Makefile"
            [ -f "$mk" ] || { echo "  ⏭️ $rel 无 Makefile，跳过"; continue; }
            line="AUTOFDO_PROFILE_${base}.o := n"
            if ! grep -qF "$line" "$mk"; then
              echo "# AFDO scope: $rel 与 profile 漂移，关闭其 PGO" >> "$mk"
              echo "$line" >> "$mk"
              APPLIED=$((APPLIED+1))
            fi
          done < "$EXCLUDE_TMP"
          echo "✅ 已关闭 $APPLIED 个文件的 AutoFDO (其余 profile 未覆盖/未改动代码保持原样)"
          echo "--- 排除清单 ---"
          cat "$EXCLUDE_TMP"


      - name: 构建内核
        run: |
          set -uo pipefail
          WORKDIR="$GITHUB_WORKSPACE"
          LTO_TYPE="${{ github.event.inputs.lto_type }}"

          # 工具链路径由安装步骤统一定位并写入 GITHUB_ENV, 这里不再重复判断版本分支。
          CLANG_DIR="${CLANG_BIN:?CLANG_BIN 未设置, 请检查工具链安装步骤}"
          RUST_BIN="$WORKDIR/kernel_workspace/rust/bin"
          if [[ -d "$RUST_BIN" ]]; then
            export PATH="$CLANG_DIR:$BUILD_TOOLS_BIN:$RUST_BIN:/usr/lib/ccache:$PATH"
          else
            # zycromerz/clang18 变体不下载 Rust 包; gki_defconfig 默认也不开
            # CONFIG_RUST, 所以这里直接跳过。不要把不存在的目录塞进 PATH。
            export PATH="$CLANG_DIR:$BUILD_TOOLS_BIN:/usr/lib/ccache:$PATH"
          fi
          export LLVM="$CLANG_DIR/"
          # 只有预置 Rust 包实际存在时才导出 RUST_LIB_SRC。
          # rust/Makefile 用的是 `?=` (不存在则回退到 `rustc --print sysroot`
          # 下的 rust-src), 无条件导出一个不存在的路径反而会覆盖掉这个
          # 好的回退, 把未来开了 CONFIG_RUST 的构建搞坏。
          if [[ -d "$WORKDIR/kernel_workspace/rust/lib/rustlib/src/rust/library" ]]; then
            export RUST_LIB_SRC="$WORKDIR/kernel_workspace/rust/lib/rustlib/src/rust/library"
          else
            unset RUST_LIB_SRC || true
          fi

          echo "───────── 构建环境 ─────────"
          echo "Clang      : $("$CLANG_DIR/clang" --version | head -1)"
          echo "ld.lld     : $("$CLANG_DIR/ld.lld" --version 2>/dev/null | head -1 || echo 缺失)"
          echo "build-tools: ${BUILD_TOOLS_BIN:-<无>}"
          echo "pahole     : $(pahole --version 2>/dev/null | head -1 || echo 未安装)"
          if command -v rustc >/dev/null 2>&1; then
            echo "rustc      : $(rustc --version)"
          elif [[ -n "${RUST_LIB_SRC:-}" ]]; then
            echo "rustc      : 预置包 ($RUST_LIB_SRC)"
          else
            # gki_defconfig 默认未启用 CONFIG_RUST, 这是正常情况, 不是 warning。
            echo "rustc      : 未提供 (gki_defconfig 默认 CONFIG_RUST=n, 不需要)"
          fi
          [[ -n "${RUST_LIB_SRC:-}" ]] && echo "RUST_LIB_SRC: $RUST_LIB_SRC" \
            || echo "RUST_LIB_SRC: 未设置 (将回退到 rustc sysroot, CONFIG_RUST=n 时无影响)"

          # ── ccache 真正启用 ──────────────────────────────────────────
          # 原先只是把 /usr/lib/ccache 加进 PATH, 而 make 走的是裸 clang
          # (仅 LLVM=1 时 CC=clang), 因此 ccache 从未被调用, 缓存命中率恒为 0。
          # 现在显式 CC="ccache clang" 并配置 sloppiness。
          export CCACHE_DIR="${CCACHE_DIR:-$HOME/.ccache}"
          mkdir -p "$CCACHE_DIR"
          export CCACHE_BASEDIR="$WORKDIR"
          export CCACHE_IS_KERNEL_COMPILING=true
          ccache -M 10G >/dev/null
          ccache -o compression=true >/dev/null
          ccache -o compiler_check=none >/dev/null
          ccache -o hash_dir=false >/dev/null
          ccache -o depend_mode=false >/dev/null
          ccache -o direct_mode=true >/dev/null
          # time_macros + include_file_mtime/ctime: 否则 __TIME__/__DATE__ 每次构建都变,
          # 引用时间宏的文件会全量重编, 缓存基本失效。
          ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros,locale >/dev/null
          echo "ccache     : $(ccache --version | head -1)"
          ccache -s | sed 's/^/            /'

          cd kernel_workspace/common

          # 异步清理磁盘空间 (给 ThinLTO 链接和 BTF 腾地方)
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/lib/jvm &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          wait

          export KBUILD_BUILD_TIMESTAMP="${KERNEL_TIME}"

          # ── MLGO / 扩展 pass flag 逐个探测 ──────────────────────────
          # 这些是 Google 下游 MLGO 实验 flag, 不同 LLVM 分支/快照支持情况不同。
          # 直接硬传一旦不支持, clang 会以 "Unknown command line argument" 失败,
          # 白跑一遍几十分钟的下载与 defconfig。这里先探测再决定是否传。
          ML_FLAGS=""
          probe_flag() {
            if echo 'int probe(void){return 0;}' \
                | "$CLANG_DIR/clang" -x c -c -o /dev/null -mllvm "$1" >/dev/null 2>&1; then
              ML_FLAGS="$ML_FLAGS -mllvm $1"
              echo "  ✅ $1"
            else
              echo "  ⏭️  当前工具链不支持, 已跳过: $1"
            fi
          }
          echo "探测可选编译 flag:"
          probe_flag "-enable-ext-tsp-block-placement=1"
          probe_flag "-regalloc-enable-advisor=release"
          probe_flag "-enable-ml-inliner=release"

          OPT_KCFLAGS="-O3 -fno-strict-aliasing -Wno-error $ML_FLAGS"

          # KBUILD_LDFLAGS 直接传给 ld.lld，不能使用 -Wl,
          # 保留较稳的 LTO/链接优化，删除风险较高或兼容性较差的 LTO 内部 pass
          OPT_LDFLAGS=""
          
          if [ "${{ github.event.inputs.autofdo_enable }}" == "true" ]; then
            echo "--- 正在将 AutoFDO Profile 注入编译器与链接器 ---"
            AFDO_FILE="$WORKDIR/kernel_workspace/kernel_aarch64.afdo"
            export CLANG_AUTOFDO_PROFILE="$AFDO_FILE"
            OPT_KCFLAGS="$OPT_KCFLAGS -fprofile-sample-use=$AFDO_FILE"
            OPT_LDFLAGS="$OPT_LDFLAGS -mllvm -sample-profile-file=$AFDO_FILE"

            # —— noinline hack 开关 ——
            # 该 sed 唯一作用是 kallsyms 化妆(让 AFDO 版符号与非 AFDO 版一致)，
            # 零性能价值；且它 strip __always_inline(arch 页表/KVM/scheduler
            # helper 都在名单里)。怀疑对象 #2，默认保持开启以复现，二分时关掉。
            if [[ "${{ github.event.inputs.autofdo_noinline_fix }}" == "true" ]]; then
              echo "--- 修复 AutoFDO 符号差异 (noinline) ---"
              grep -rlE -f "$WORKDIR/autofdo_defs.pat" --include='*.c' \
                --exclude-dir=.git --exclude-dir=out . > /tmp/afdo_files.txt || true
              echo "命中源文件: $(wc -l < /tmp/afdo_files.txt)"
              if [ -s /tmp/afdo_files.txt ]; then
                xargs -a /tmp/afdo_files.txt sed -E -i -f "$WORKDIR/autofdo_noinline.sed"
                echo "✅ AutoFDO 符号差异修复完成"
              fi
            else
              echo "⏭️ 已跳过 noinline hack (autofdo_noinline_fix=false)，kallsyms 可能与非 AFDO 版有差异，属预期"
            fi
          fi
          
          OPLUS_KMI_LIST="android/abi_gki_aarch64_oplus"
          if [ -f "$OPLUS_KMI_LIST" ]; then
            echo "✅ 检测到 KMI 符号表: $OPLUS_KMI_LIST"
            export ABI_FLAGS="KMI_SYMBOL_LIST=$OPLUS_KMI_LIST KMI_SYMBOL_LIST_STRICT=1"
          else
            export ABI_FLAGS=""
          fi

          echo "KBUILD_LDFLAGS += $OPT_LDFLAGS" >> Makefile

          # ── ThinLTO 产物缓存 (仅 lto=thin 时有意义, 随 ccache 独立 restore/save) ──
          LDCACHE_DIR="$WORKDIR/ldcache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          mkdir -p "$LDCACHE_DIR"
          if [[ "$LTO_TYPE" == "thin" ]]; then
            echo '#!/bin/bash' > "$PWD/ld-wrapper"
            echo 'exec ld.lld "$@" --thinlto-cache-dir="'"$LDCACHE_DIR"'" --thinlto-jobs='"$(($(nproc --all) / 2))" >> "$PWD/ld-wrapper"
            chmod +x "$PWD/ld-wrapper"
            LD_WRAPPER="$PWD/ld-wrapper"
            echo "ld-wrapper: $LD_WRAPPER (thinlto-cache-dir=$LDCACHE_DIR)"
          else
            LD_WRAPPER="ld.lld"
          fi

          echo "--- 生成内核配置 ---"
          # 配置阶段不带 EXTRA_CFLAGS(否则 -mcpu 只影响后段, 前后不一致)。
          # 用 KCFLAGS 而不是官方 build.sh: 官方检查在此树上会因自定义 config 挂掉,
          # 所以 defconfig 后仍跑一次 olddefconfig 让追加的选项落盘。
          make -j$(nproc --all) \
            LLVM=1 LLVM_IAS=1 \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="$LD_WRAPPER" HOSTLD="$LD_WRAPPER" \
            O=out \
            gki_defconfig

          echo "--- 编译内核镜像 ---"
          make -j$(nproc --all) \
            LLVM=1 LLVM_IAS=1 \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="$LD_WRAPPER" HOSTLD="$LD_WRAPPER" \
            O=out \
            KCFLAGS="$OPT_KCFLAGS ${EXTRA_CFLAGS:-}" \
            $ABI_FLAGS \
            Image

          echo "内核编译完成！"
          echo "───────── 编译缓存统计 ─────────"
          ccache -s
          du -sh "$LDCACHE_DIR" 2>/dev/null || true
          df -h
          
      - name: 保存 CCache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: 保存 LTO Cache
        if: success() && inputs.lto_type == 'thin'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ldcache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}
          key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            lto-cache-${{ runner.os }}-${{ github.ref_name }}-

      - name: 保存工具链缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            kernel_workspace/zyc-clang
            kernel_workspace/clang19
            kernel_workspace/clang18
            kernel_workspace/build-tools
            kernel_workspace/rust
          key: tc-${{ github.event.inputs.clang_version }}-${{ runner.os }}-${{ github.run_id }}

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi
          
          # 修复: 改用正确的 custom_kernel_suffix 并去除了未定义的 KSU 变量避免文件名难看
          if [[ -n "${{ github.event.inputs.custom_kernel_suffix }}" ]]; then
            zip -r "../AnyKernel3_A15_${{ env.KERNEL_VERSION }}${{ github.event.inputs.custom_kernel_suffix }}.zip" ./*
          else
            zip -r "../AnyKernel3_A15_${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}.zip" ./*
          fi

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 设置环境变量
        run: |
          # 修复: 改为 custom_kernel_suffix 并调整了拼接格式防止出现双破折号
          if [[ -n "${{ github.event.inputs.custom_kernel_suffix }}" ]]; then
            FULL_VERSION="${{ env.KERNEL_VERSION }}.89${{ github.event.inputs.custom_kernel_suffix }}"
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          else
            FULL_VERSION="${{ env.KERNEL_VERSION }}.89-${{ env.KERNEL_NAME }}"
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          fi
          
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="OPPO+OPlus+Realme-A15-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          
          # 修复: 添加了双引号以防止在 ksu_type 为空时抛出 Bash 语法错误
          if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "mksu" ]]; then
            KSU_TYPENAME="MKSU"
          elif [[ "${{ github.event.inputs.ksu_type }}" == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV
         
      - name: 创建发布
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ env.TAG_HEAD }}-${{ env.TIME }}"
          name: "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}"
          body: |
            ### 📱 欧加真 ${{ env.KSU_TYPENAME }} SM8750 通用内核 | 构建信息
            - 内核版本号: ${{ env.FULL_VERSION }}
            - 编译时间: ${{ env.TIME_FORM }}
            - 机型：欧加真骁龙8Elite通用 6.6.89 内核（基于一加13国际版 6.6.89 版官方OKI源码）
            - 编译器：${{ github.event.inputs.clang_version }} (${{ github.event.inputs.cpu_opt == 'true' && '带 -mcpu=oryon-1' || '通用调优' }}, LTO 等级：${{ github.event.inputs.lto_type }})
            - Polly / AutoFDO / 内存补丁：${{ github.event.inputs.polly_enable }} / ${{ github.event.inputs.autofdo_enable }} / ${{ github.event.inputs.mem_opt_patches }}
            - 特性：${{ env.KSU_TYPENAME }}
            - LZ4/LZ4KD支持：${{ github.event.inputs.lz4_enable }} / ${{ github.event.inputs.lz4kd_enable }}
            - SchedUtil/CPU 优化：${{ github.event.inputs.schedutil_opt }} / ${{ github.event.inputs.cpu_opt }}
            - 网络功能增强：${{ github.event.inputs.better_net }}
            - BBR/Brutal 拥塞控制算法支持：${{ github.event.inputs.bbr_enable }}
            - ADIOS IO调度器支持：${{ github.event.inputs.adios_enable }}
            - Re-Kernel支持：${{ github.event.inputs.rekernel_enable }}
            - 基础防护：防格机(${{ github.event.inputs.baseband_guard }}) | LRNG v60(${{ github.event.inputs.lrng_enable }})
            
            ### ⏫️ 更新内容：
            - 更新${{ env.KSU_TYPENAME }}
            
            ### 📋 安装方法 | Installation Guide
            1. 若你的手机已经安装了第三方Recovery（如TWRP)，可下载对应机型的AnyKernel刷机包后进入Recovery模式，通过Recovery刷入刷机包后重启设备；
            2. 若你的手机之前已有 root 权限，可在手机上安装[HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在HorizonKernelFlasher中刷入AnyKernel刷机包并重启；
            3. 若你之前已刷入SukiSU Ultra内核，且SukiSU Ultra管理器已更新至最新版本，可在SukiSU Ultra管理器中直接刷入AnyKernel刷机包并重启；
            4. 刷入无lz4kd补丁版的内核前若刷入过lz4kd补丁版的内核，为避免出错，请先关闭zram模块；
            5. 由于KernelSU上游更新了元模块功能，最新版KSU管理器需要配合元模块才能正常挂载模块。目前的元模块包括 meta overlayfs, mountify, meta magicmount 等。
            6. KernelPatch Next（即KPN）是一个独立于KSU的KPM实现，不能与(Re)SukiSU内置的kpm功能共同使用。
            
            #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用KernelFlasher等软件备份boot等关键启动分区!※※※
